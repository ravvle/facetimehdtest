name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # No schedule: CI runs only on push, pull request, or a manual dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      # Every shell script in the repository, with no exceptions list to drift.
      # tests/hw-validate.sh used to be left out because it needs a MacBook to
      # *run*; it does not need one to lint, and at 1200 lines it was the
      # largest unlinted file here.
      - name: Lint
        run: |
          shellcheck -x --source-path=SCRIPTDIR \
            setup.sh \
            scripts/install.sh scripts/uninstall.sh \
            scripts/macbook-tune.sh \
            scripts/extract-firmware.sh \
            scripts/collect-diagnostics.sh \
            packaging/build-deb.sh packaging/build-rpm.sh \
            tests/build-driver.sh tests/smoke-capture.sh \
            tests/hw-validate.sh tests/script-smoke.sh
      # Catches a script added to the repository and never added above.
      #
      # Scoped to the Lint step's own run block below, not the whole workflow
      # file: a script named only in an explanatory comment elsewhere in this
      # file would otherwise satisfy a plain grep without ever reaching
      # shellcheck - which is exactly how the largest test script here once
      # went unlinted for a while.
      - name: Every shell script is linted
        run: |
          lint_step="$(sed -n '/- name: Lint$/,/- name: Every shell script is linted$/p' \
                           .github/workflows/ci.yml)"
          rc=0
          while IFS= read -r f; do
            printf '%s\n' "$lint_step" | grep -q -- "$f" ||
              { echo "$f is not in the shellcheck list"; rc=1; }
          done < <(git ls-files '*.sh' | grep -v '^scripts/lib/')
          exit $rc
      - name: Check scripts are executable
        run: |
          for f in setup.sh scripts/*.sh tests/*.sh packaging/*.sh; do
            [ -x "$f" ] || { echo "$f is not executable"; exit 1; }
          done

  script-smoke:
    # Drives the installer and uninstaller far enough to catch the failures
    # shellcheck structurally cannot see: an option documented and never wired
    # up, a --status that dies on a machine with no camera, a dkms status
    # format that stopped parsing, a source file added to the tree and not to
    # the Makefile. Runs as a normal user and touches nothing outside its own
    # temporary directory.
    name: installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the script smoke test
        run: ./tests/script-smoke.sh

  packages:
    # The .deb and .rpm are only useful if they still build, and neither is
    # exercised by anything else here.
    name: packaging (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            packages: dpkg-dev
            build: ./packaging/build-deb.sh
          - kind: rpm
            packages: rpm
            build: ./packaging/build-rpm.sh
    steps:
      - uses: actions/checkout@v5
      - name: Install the packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Build
        run: ${{ matrix.build }}
      - name: Show what was built
        run: ls -l packaging/out/
      - uses: actions/upload-artifact@v4
        with:
          name: facetimehd-${{ matrix.kind }}
          path: packaging/out/*
          if-no-files-found: error

  apple-sources:
    # The early-warning system for the *other* thing that can break this project
    # without anyone touching it. The driver half is covered by the build matrix
    # below; this is the firmware half. If Apple retires the update this
    # extracts from, or republishes it with different content, every new install
    # breaks and the first anyone would otherwise know is a bug report.
    #
    # Downloads ~4 MB, verifies it against the checksum tables in
    # extract-firmware.sh, and writes nothing: no Apple content is stored, and
    # the job is a checksum comparison rather than a redistribution.
    #
    # Not run on pull requests: a fork's CI has no business hammering Apple's
    # CDN, and a failure here is never caused by the diff under review.
    name: Apple download watchdog
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the extractor's dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio curl unar xz-utils
      - name: Verify both Apple downloads still match the checksum tables
        run: ./scripts/extract-firmware.sh --check-sources

  build:
    # Compiles src/facetimehd against each supported kernel's
    # headers. This is the early-warning system for kernel API churn: if a new
    # kernel drops an API the driver uses, this goes red here instead of on a
    # user's laptop after 'apt upgrade'.
    name: build (${{ matrix.name }}, kernel ${{ matrix.kernel-note }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'ubuntu 22.04'
            container: 'ubuntu:22.04'
            family: debian
            kernel-note: '5.15 / HWE'
            experimental: false
          - name: 'ubuntu 24.04'
            container: 'ubuntu:24.04'
            family: debian
            kernel-note: '6.8 / HWE'
            experimental: false
          - name: 'ubuntu 26.04'
            container: 'ubuntu:26.04'
            family: debian
            kernel-note: '7.0'
            experimental: false
          # Fedora carries the newest kernel of anything here, so it is where
          # kernel API churn shows up first.
          - name: 'fedora 44'
            container: 'fedora:44'
            family: rpm
            kernel-note: '7.1'
            experimental: false
          # AlmaLinux 10 is the opposite end: an Enterprise Linux kernel that
          # stays on 6.12 for a decade while Red Hat backports into it. It
          # catches the mirror image of Fedora's failure - code that assumes an
          # API newer than the oldest supported kernel - and it is the only
          # RHEL rebuild whose kernel clears this driver's 5.15 floor, EL9
          # having shipped 5.14.
          - name: 'almalinux 10'
            container: 'almalinux:10'
            family: rpm
            kernel-note: '6.12 / EL'
            experimental: false
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and kernel headers (apt)
        if: matrix.family == 'debian'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential kmod linux-headers-generic

      - name: Install toolchain and kernel headers (dnf)
        if: matrix.family == 'rpm'
        run: |
          # CodeReady Builder carries build dependencies on Enterprise Linux.
          # Everything installed below is in AppStream on EL10 and AlmaLinux
          # enables CRB by default anyway, so this is belt and braces for an
          # older EL image. Guarded on the repository actually existing, so it
          # stays a no-op on Fedora instead of writing a stray [crb] section
          # into its dnf config; config-manager is a plugin and need not be
          # installed at all, hence the || true.
          if dnf repolist --all 2>/dev/null |
               awk 'NR > 1 && $1 == "crb" { f = 1 } END { exit !f }'; then
            dnf config-manager setopt crb.enabled=1 2>/dev/null ||
              dnf config-manager --set-enabled crb 2>/dev/null || true
          fi
          dnf install -y --setopt=install_weak_deps=False \
            gcc make tar kmod elfutils-libelf-devel kernel-devel

      - name: Build the driver out-of-tree (apt)
        if: matrix.family == 'debian'
        env:
          WERROR: '1'
        run: ./tests/build-driver.sh

      - name: Build the driver out-of-tree (dnf)
        if: matrix.family == 'rpm'
        # kernel-devel unpacks to /usr/src/kernels/<ver>. The container has no
        # kernel package, so the /lib/modules/<ver>/build symlink that would
        # point there on a real system does not exist - hand the tree to
        # build-driver.sh directly.
        env:
          WERROR: '1'
        run: |
          KDIR="$(ls -d /usr/src/kernels/*/ | head -1)"
          echo "Building against $KDIR"
          KDIR="$KDIR" ./tests/build-driver.sh

  driver-clang:
    name: driver build (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Strict build against Clang-built kernel headers
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            docker.io/chimeralinux/chimera:latest sh -euxc '
              apk update
              apk add bash clang gmake kmod linux-stable-devel lld llvm
              KDIR="$(ls -d /usr/src/linux-headers-* | head -1)"
              MAKE=gmake LLVM=1 W=1 WERROR=1 KDIR="$KDIR" \
                bash ./tests/build-driver.sh
            '

  driver-sparse:
    name: driver static analysis (Sparse)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Sparse and kernel headers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential kmod linux-headers-generic sparse
      - name: Sparse semantic checks
        env:
          SPARSE: '1'
          W: '1'
        run: ./tests/build-driver.sh
